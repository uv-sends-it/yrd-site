name: PR website preview

on:
  pull_request:
    types: [opened, reopened, synchronize]

# Previews only use branches from this repository. PRs from external forks
# continue to receive normal CI checks but cannot access deployment secrets.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Keep preview traffic out of production analytics
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'content/site.json';
          const site = JSON.parse(fs.readFileSync(file, 'utf8'));
          site.umamiWebsiteId = '';
          fs.writeFileSync(file, JSON.stringify(site, null, 2) + '\n');
          NODE

      - name: Build Eleventy site
        run: npm run build

      - name: Verify output and prevent search indexing
        run: |
          test -f _site/index.html
          test -f _site/join/index.html
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > _site/_headers

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: _site/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish preview to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    environment:
      name: pr-previews
      url: ${{ steps.publish.outputs['pages-deployment-alias-url'] || steps.publish.outputs['deployment-url'] }}
    env:
      CF_PAGES_PROJECT: yrd-site-pr-previews
    steps:
      - name: Download prebuilt files (no PR code execution in this job)
        uses: actions/download-artifact@v4
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: _site/

      - name: Check Cloudflare credentials and create preview project if needed
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets (see docs/PR_PREVIEWS.md)."
            exit 1
          fi

          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          output="${RUNNER_TEMP}/cloudflare-project.json"
          status=$(curl --silent --show-error --retry 3 --output "$output" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$base/$CF_PAGES_PROJECT")
          case "$status" in
            200)
              if ! jq -e '.success == true and .result.production_branch == "main"' "$output" >/dev/null; then
                echo "::error::Existing preview project has unexpected configuration; refusing to deploy."
                exit 1
              fi
              echo "Using existing Cloudflare Pages preview project."
              ;;
            404)
              echo "Creating dedicated Cloudflare Pages preview project."
              curl --fail-with-body --silent --show-error --request POST \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                --header 'Content-Type: application/json' \
                --data "{\"name\":\"$CF_PAGES_PROJECT\",\"production_branch\":\"main\"}" \
                "$base" > "$output"
              jq -e '.success == true' "$output" >/dev/null
              ;;
            *)
              echo "::error::Unable to inspect Cloudflare Pages project (HTTP $status)."
              jq -r '.errors[]?.message' "$output" || true
              exit 1
              ;;
          esac

      - name: Publish PR preview
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=yrd-site-pr-previews --branch=pr-${{ github.event.pull_request.number }}

      - name: Add preview URL to job summary
        env:
          PREVIEW_URL: ${{ steps.publish.outputs['pages-deployment-alias-url'] || steps.publish.outputs['deployment-url'] }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::Cloudflare did not return a preview URL."
            exit 1
          fi
          {
            echo "### PR #$PR_NUMBER — website preview"
            echo
            echo "[Open the preview website]($PREVIEW_URL)"
            echo
            echo "This is isolated from the live GitHub Pages deployment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post or refresh preview link on the pull request
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          PREVIEW_URL: ${{ steps.publish.outputs['pages-deployment-alias-url'] || steps.publish.outputs['deployment-url'] }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- yrd-website-preview -->';
            const url = process.env.PREVIEW_URL;
            if (!url) throw new Error('No Cloudflare Pages preview URL was returned.');
            const body = [
              marker,
              '### Website preview',
              '',
              '**[Open this PR’s website preview](' + url + ')**',
              '',
              'This URL updates after each push to this PR. Production remains at yarrariverdragons.com.au.',
              'Preview visits are excluded from production Umami analytics.'
            ].join('\n');
            const opts = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...opts, per_page: 100 });
            const previous = comments.find(item => item.user?.type === 'Bot' && item.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: opts.owner, repo: opts.repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({ ...opts, body });
            }
